<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LNXcore"><title>LNXcore</title>
<style>
:root{--bg:#f2f2f4;--card:#fff;--tx:#17171a;--mu:#6b6b76;--ln:#dcdce2;--rd:#c8102e;--ac:#c8102e;--ok:#1a9d55;--wn:#d98a00}
:root[data-t=dark]{--bg:#0e0e11;--card:#1a1a1f;--tx:#f1f1f4;--mu:#9b9ba8;--ln:#2c2c35;--rd:#e0314b;--ac:#e0314b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#splash{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:16px;text-align:center}
#puz{position:relative;width:min(92vw,560px);aspect-ratio:1482/875;perspective:800px}
.pc{position:absolute;background-repeat:no-repeat;transition:transform 1.3s cubic-bezier(.2,.8,.2,1),opacity .9s;will-change:transform}
#st{opacity:0;transition:opacity 1s;margin-top:22px}#st.on{opacity:1}
#st h1{font-size:44px;margin:0;letter-spacing:1px}#st h1 b{color:#e0314b}#st p{color:#aaa;margin:6px 0 18px;font-size:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn.sm{padding:7px 12px;font-size:14px}
header{position:sticky;top:env(safe-area-inset-top);background:var(--card);border-bottom:1px solid var(--ln);z-index:10;padding:10px 12px;display:flex;align-items:center;gap:10px}
header .bk{font-size:22px;background:none;border:0;color:var(--ac);padding:0 6px}header h2{flex:1;margin:0;font-size:17px}
header .lg{font-weight:800;color:var(--tx)}header .lg b{color:var(--ac)}
#crumb{font-size:12px;color:var(--mu);padding:6px 14px 0}
main{padding:10px 12px 90px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:10px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--ln);min-height:48px}
.row:last-child{border-bottom:0}.row.nv:active{background:var(--ln)}.row .l{flex:1}.row .s{font-size:12px;color:var(--mu)}.row .v{color:var(--mu);font-size:14px;text-align:right;max-width:45%}
.row .ch{color:var(--mu)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin:16px 6px 4px}
.ref{display:inline-block;font-size:11px;background:rgba(200,16,46,.12);color:var(--ac);border-radius:20px;padding:2px 8px;text-decoration:none;font-weight:600;white-space:nowrap}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:10px}
input[type=range]{padding:0}.row input,.row select{width:auto;max-width:55%}
.seg{background:#120000;color:#ff2a2a;font-family:Menlo,monospace;font-size:38px;letter-spacing:4px;text-shadow:0 0 8px #f00;border-radius:8px;padding:6px 14px;display:inline-block;border:2px solid #333}
.big{font-size:30px;font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}.mini .k{font-size:12px;color:var(--mu)}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--ln);color:var(--mu);margin-right:4px}.tag.r{background:var(--rd);color:#fff}
.pos{display:inline-block;min-width:26px;text-align:center;font-weight:800;background:var(--ac);color:#fff;border-radius:6px;padding:2px 6px;margin-right:6px}
.ch1{font-family:Menlo,monospace;font-size:22px;letter-spacing:5px;word-break:break-all}
.note{font-size:13px;color:var(--mu);padding:8px 14px}.ok{color:var(--ok)}.bad{color:var(--rd)}
.dd{position:relative}.ddl{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;max-height:260px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ddl div{padding:10px 12px;border-bottom:1px solid var(--ln);font-size:14px}.ddl div:active{background:var(--ln)}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0}.tabs .btn{white-space:nowrap}
img.bd{width:100%;border-radius:10px;display:block}
pre.x{white-space:pre-wrap;font-size:13px;padding:10px 14px;margin:0}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}
</style></head><body>

<div id="app" hidden><header><button class="bk" id="bk">‹</button><h2 id="ttl"></h2><span class="lg">LNX<b>core</b></span></header><div id="crumb"></div><main id="main"></main></div>
<script>
const D={"al":[{"c":"1","m":"ERRATIC POWER (single phase units)","a":"• Power loss for 50ms or raw voltage is below 15VAC. This may indicate that the unit power is dirty or is of low quality. • Check power connections. • The CORE Unit Controller will set an alarm “Erratic Power” whenever service is turned off due to detection of power loss. The CORE Unit Controller will shut itself down during an erratic power detection to protect its internally components and reset.","p":76},{"c":"2 - 3","m":"RESERVED","a":"","p":76},{"c":"4*","m":"SMOKE DETECTED","a":"A173 input is sensed as closed. Will automatically clear once input is detected open. For smoke mode, check for source of smoke. While Smoke Alarm is active, the CORE Unit Controller will not service any cooling, heating, or ventilation demands.","p":76},{"c":"5*","m":"BLOWER - NO AIRFLOW DETECTED","a":"Unit off. Air flow switch is normally open. Monitoring starts 16 seconds after blower is start- ed. If air flow switch is detected open after 16 second delay period, all compressors are de-energized, gas valves closed, electric heat turned off, economizer damper closed, and blower is stopped. Alarm will automatically clear once the error timed off delay has expired and system will resume. Check blower operation.","p":76},{"c":"6*","m":"DIRTY AIR FILTER","a":"Dirty filter switch is detected as closed and will automatically clear after switch is detected open. Replace filter or check filter switch S27.","p":76},{"c":"7","m":"RESERVED","a":"","p":76},{"c":"8*","m":"STRIKE 3 ON BLOWER NO AIRFLOW","a":"Lockout is active with multiple alarm code 5 detected. Alarm can be manually cleared through the user interface. Check blower operation. Once problem is corrected, lockout alarm can be cleared by resetting the CORE Unit Controller.","p":76},{"c":"9 - 11","m":"RESERVED","a":"","p":76},{"c":"12","m":"HIGH PRESSURE SWITCH COMPRESSOR 1","a":"• Compressor is off. Check charge, fans, and coil. NOTE: On Ultra-High Efficiency units - if only Alarm 12 is present then issue could be high temperature S5 switch. If Alarm 12 is accompanied by Alarm 14 then most likely it is the high pressure S4 switch. • The unit controller will clear high pressure switch alarm when corresponding high pressure switch is detected as closed. Compressor will not restart until corresponding high pressure switch is closed and Minimum Off Delay (cooling or heating) has expired.","p":76},{"c":"13*","m":"HIGH PRESSURE STRIKE 3 COMPRESSOR 1","a":"• Compressor is lockout. Check charge, fans, and coil. Use service menu to clear lockouts. • User will be able to clear high pressure switch compressor lockout and alarm via user interface. High pressure switch compressor lockout and alarm will be cleared after the CORE Unit Controller reset. • High pressure switch compressor lockout and alarm will be cleared on termination of cooling demand. • Default is 3 occurrences and can be set between 1 and 7 occurrences.","p":76},{"c":"14","m":"HIGH PRESSURE SWITCH COMPRESSOR 2","a":"• Compressor is off. Check charge, fans, or coil. • The CORE Unit Controller will clear high pressure switch alarm when corresponding high pressure switch is detected as closed. Compressor will not be restarted until corresponding high pressure switch is closed and Minimum Off Delay (cooling or heating) has expired.","p":76},{"c":"15*","m":"HIGH PRESSURE STRIKE 3 - COMPRESSOR 2","a":"• Compressor lockout. Check charge, fans, and coil. Use service menu to clear lockouts. • User will be able to clear high pressure switch compressor lockout and alarm via user interface. High pressure switch compressor lockout and alarm will be cleared after the CORE Unit Controller reset. • High pressure switch compressor lockout and alarm will be cleared on removal of cooling demand. • Default is 3 occurrences and can be set between 1 and 7 occurrences.","p":76},{"c":"16","m":"HIGH PRESSURE SWITCH - COMPRESSOR 3","a":"• Compressor is off. Check charge, fans, and coil. • The CORE Unit Controller will clear high pressure switch alarm when corresponding high pressure switch is detected as closed. Compressor will not be restarted until corresponding high pressure switch is closed and Minimum Off Delay (cooling or heating) has expired.","p":76},{"c":"17*","m":"HIGH PRESSURE STRIKE 3 - COMPRESSOR 3","a":"• Compressor lockout. Check charge, fans, and coil. Use CORE Service application RTU > SERVICE menu to clear lockouts. • User will be able to clear high pressure switch compressor lockout and alarm through the user interface. High pressure switch compressor lockout and alarm will be cleared after the CORE Unit Controller reset. • High pressure switch compressor lockout and alarm is cleared on removal of cooling demand. Default is 3 occurrences and can be set between 1 and 7 occurrences.","p":77},{"c":"18","m":"HIGH PRESSURE SWITCH - COMPRESSOR 4","a":"• Compressor lockout. Check charge, fans, and coil. • The CORE Unit Controller will clear high pressure switch alarm when corresponding high pressure switch is detected as closed. Compressor will not be restarted until corresponding high pressure switch is closed and Minimum Off Delay (cooling or heating) has expired.","p":77},{"c":"19*","m":"HIGH PRESSURE STRIKE 3 - COMPRESSOR 4","a":"• Compressor lockout. Check charge, fans and coil. Use service menu to clear lockouts. • User will be able to clear high pressure switch compressor lockout and alarm via user interface. High pressure switch compressor lockout and alarm will be cleared after the CORE Unit Controller reset. • High pressure switch compressor lockout and alarm is cleared on removal of cooling demand. Default is 3 occurrences and can be set between 1 and 7 occurrences.","p":77},{"c":"20","m":"PHASE MONITOR FAULT","a":"External phase monitor is indicating an issue.","p":77},{"c":"21","m":"RESERVED","a":"","p":77},{"c":"22","m":"LOW PRESSURE SWITCH COMPRESSOR 1","a":"Compressor is off. Check charge, fans and coil. Use service menu to clear lockouts.","p":77},{"c":"23*","m":"STRIKE 3 LOW PRESSURE COMPRESSOR 1","a":"• Compressor is off. Check charge, fans and coil. Use service menu to clear lockouts. • Number of occurrences is set using Parameter 99 (max lo occurrences). Default is 3 occurrences.","p":77},{"c":"24","m":"LOW PRESSURE SWITCH COMPRESSOR 2","a":"Compressor is off. Check charge, fans and coil.","p":77},{"c":"25*","m":"STRIKE 3 LOW PRESSURE COMPRESSOR 2","a":"• Compressor is off. Check charge, fans and coil. Use service menu to clear lockouts. • Number of occurrences is set using Parameter 99 (max lo occurrences). Default is 3 occurrences.","p":77},{"c":"26","m":"LOW PRESSURE SWITCH COMPRESSOR 3","a":"Compressor if off. Check charge, fans and coil.","p":77},{"c":"27*","m":"STRIKE 3 LOW PRESSURE COMPRESSOR 3","a":"• Compressor is off. Check charge, fans and coil. Use service menu to clear lockouts. • Number of occurrences is set using Parameter 99 (max lo occurrences). Default is 3 occurrences.","p":77},{"c":"28","m":"LOW PRESSURE SWITCH COMPRESSOR 4","a":"Compressor if off. Check charge, fans and coil.","p":77},{"c":"29*","m":"STRIKE 3 LOW PRESSURE COMPRESSOR 4","a":"• Compressor is off. Check charge, fans and coil. Use service menu to clear lockouts. • Number of occurrences is set using Parameter 99 (max lo occurrences). Default is 3 occurrences.","p":77},{"c":"30*","m":"DRAIN PAN OVERFLOW SWITCH","a":"• Check for block drain, condensate lines and drain pan overflow switch. • Alarm set if overflow switch is detected opened and compressor will be locked out. System will automatically clear alarm once switch is detected closed. System will resume operation (compressor lockout), after the Error Timed OFF Delay has expired following the Overflow switch alarm clear.","p":77},{"c":"31","m":"RESERVED","a":"","p":77},{"c":"32","m":"EVAPORATOR FROZEN COMPRESSOR 1","a":"Compressor is off. Check SST sensor, air flow, charge, coil, air filter and outside air tem- perature.","p":77},{"c":"33*","m":"STRIKE 3 EVAPORATOR FROZEN COMPRESSOR 1","a":"• Compressor is locked out. Check SST sensor, air flow, charge, coil, air filter and outside air temperature. • Number of occurrences is set using Parameter 81 (max freeze stat occ). Default is 3 occurrences.","p":77},{"c":"34","m":"EVAPORATOR FROZEN COMPRESSOR 2","a":"Compressor is off. Check SST sensor, air flow, charge, coil, air filter and outside air tem- perature.","p":77},{"c":"35*","m":"STRIKE 3 EVAPORATOR FROZEN COMPRESSOR 2","a":"• Compressor is locked out. Check SST sensor, air flow, charge, coil, air filter, and outside air temperature. • Number of occurrences is set using Parameter 81 (max freeze stat occ). Default is 3 occurrences.","p":78},{"c":"36","m":"EVAPORATOR FROZEN COMPRESSOR 3","a":"Compressor is off. Check SST sensor, air flow, charge, coil, air filter, and outside air tem- perature.","p":78},{"c":"37*","m":"STRIKE 3 EVAPORATOR FROZEN COMPRESSOR 3","a":"• Compressor is locked out. Check SST sensor, air flow, charge, coil, air filter, and outside air temperature. • Number of occurrences is set using Parameter 81 (max freeze stat occ). Default is 3 occurrences.","p":78},{"c":"38","m":"EVAPORATOR FROZEN COMPRESSOR 4","a":"Compressor is off. Check SST sensor, air flow, charge, coil, air filter, and outside air tem- perature.","p":78},{"c":"39*","m":"STRIKE 3 EVAPORATOR FROZEN COMPRESSOR 4","a":"• Compressor is locked out. Check SST sensor, air flow, charge, coil, air filter and outside air temperature. • Number of occurrences is set using Parameter 81 (max freeze stat occ). Default is 3 occurrences.","p":78},{"c":"40","m":"RETURN AIR OVER HEAT LIMIT","a":"Heat is above setpoint as defined by parameter 115.","p":78},{"c":"41","m":"RETURN AIR UNDER COOL LIMIT","a":"Cool is below setpoint as defined by parameter 114.","p":78},{"c":"42","m":"BLOWER MOTOR OVERLOAD","a":"Blower motor is overloaded. System shutdown.","p":78},{"c":"43","m":"RESERVED","a":"","p":78},{"c":"44*","m":"GAS VALVE ON NO DEMAND GV1","a":"Unit is off. Gas valve 1 has power, but no demand. Check gas valve and wiring.","p":78},{"c":"45*","m":"GAS VALVE ON NO DEMAND GV2","a":"Unit is off. Gas valve 2 has power, but no demand. Check gas valve and wiring.","p":78},{"c":"46 - 48","m":"RESERVED","a":"","p":78},{"c":"49","m":"NO 24VAC POWER ON C3","a":"No 24VAC relay power On A59 (C2) Board, TB35-1 Input. (A59)","p":78},{"c":"50","m":"PRIMARY HEAT 1 LIMIT OPEN S10","a":"Heat section 1 primary gas heat limit switch is open. Check air flow, air filter, limit switch, and wiring.","p":78},{"c":"51*","m":"STRIKE 3 PRIMARY HEAT 1 LIMIT OPEN","a":"Heat section 1 primary gas heat limit switch is open. Check air flow, air filter, limit switch, and wiring. Number of occurrences is reached.","p":78},{"c":"52","m":"SECONDARY HEAT 1 LIMIT OPEN S21","a":"Heat section 1 secondary gas heat limit switch is open. Check air flow, air filter, limit switch and wiring.","p":78},{"c":"53","m":"STRIKE3 SEC HEAT LIMIT OPEN","a":"Heat section 1 secondary gas heat limit switch has opened 3 (default) times during a demand.","p":78},{"c":"54","m":"HEAT 1 S15 LIMIT OR ROLLOUT OPEN","a":"Heat section 1 primary electric heat limit switch is open. Check air flow, air filter, limit switch, and wiring.","p":78},{"c":"55*","m":"STRIKE 3 HEAT 1 S15 LIMIT OR ROLL- OUT","a":"Heat section 1 flame roll out burner 1 switch is open. Check gas roll out switch S47.","p":78},{"c":"56","m":"HEAT 1 CAI SWITCH S18","a":"Check heat section 1 combustion air motor and proof switch.","p":78},{"c":"57*","m":"STRIKE 3 HEAT 1 CAI SWITCH S18","a":"Check heat section 1 combustion air motor and proof switch. Number of occurrences is reached.","p":78},{"c":"58","m":"HEAT 1 NO PROOF GV1","a":"Check heat section 1 ignition control, flame proof, gas valve 1, and gas supply.","p":78},{"c":"59*","m":"STRIKE 3 HEAT 1 NO PROOF GV1","a":"Check heat section 1 ignition control, flame proof, gas valve 1, and gas supply. Number of occurrences is reached.","p":78},{"c":"60","m":"PRIMARY HEAT 2 LIMIT OPEN S99","a":"Check heat section 2 primary burner limit switch to see if it is open. Check air flow, limit switch, and wiring.","p":78},{"c":"61*","m":"STRIKE 3 PRIMARY HEAT LIMIT OPEN","a":"Check heat section 2 primary burner limit switch to see if it is open. Check air flow, limit switch, and wiring. Number of occurrences is reached.","p":78},{"c":"62","m":"SECONDARY HEAT 2 LIMIT OPEN S100","a":"Heat section 2 secondary heat limit switch is open. Check air flow, limit switch, and wiring.","p":78},{"c":"63","m":"STRIKE3 SEC HEAT LIMIT OPEN","a":"Heat section 2 secondary gas heat limit switch has opened 3 (default) times during a demand.","p":78},{"c":"64","m":"HEAT 2 CAI SWITCH S45 HEAT 2 ROLLOUT OPEN","a":"Flames have been detected outside the gas heater’s fire box.","p":78},{"c":"65*","m":"STRIKE 3 HEAT 2 ROLL OUT OPEN","a":"Check roll out sensor and gas supply.","p":78},{"c":"66","m":"HEAT 2 CAI SWITCH S45","a":"Check heat section 2 combustion air motor and proof switch.","p":78},{"c":"67*","m":"STRIKE 3 HEAT 2 CAI SWITCH S45","a":"Check heat section 2 combustion air motor and proof switch. Number of occurrences is reached.","p":78},{"c":"68","m":"HEAT 2 NO PROOF GV2","a":"Check heat section 2 ignition control, flame roof, gas valve 2, and gas supply","p":79},{"c":"69*","m":"STRIKE 3 HEAT 2 NO PROOF GV3","a":"Check heat section 2 ignition control, flame roof, gas valve 2, and gas supply. Number of occurrences is reached.","p":79},{"c":"70 - 72","m":"RESERVED","a":"","p":79},{"c":"73","m":"NETWORK SENSOR","a":"Check with integrator for refresh rate, network status lights, and wiring.","p":79},{"c":"74*","m":"ZONE SENSOR","a":"• If measurement is out of specified range (including open/short detection) the system will ignore the Zone Temperature Sensor readings and set the alarm. • If measurement of Zone Temperature Sensor is out of specified range (including open/short detection) the system will change operating mode to the specified Backup mode (None, Local Thermistor or Return Air temp). • The system will clear the alarm, if zone temperature sensor measurement is detected in specified operating range and return the system to monitoring the A2 sensor as the primary sensor input. • Check zone (room) sensor and wiring.","p":79},{"c":"75*","m":"OUTDOOR TEMP SENSOR","a":"• If measurement of the outdoor temperature sensor is out of specified range (including open / short detection) the alarm will be activated. Alarm will automatically clear once in range condition is detected. • Check sensor and wiring.","p":79},{"c":"76*","m":"HUMIDITY SENSOR","a":"• If measurement is below specified range ( <5 % RH) the system will ignore the Relative Humidity readings. If measurement is above the specified range ( >100% RH) the system will limit the value to 100%. • If measurement of Relative Humidity Sensor is below specified range while the dehumidification mode using RH sensor is enabled, the system will set an alarm. The system will clear the alarm if Relative Humidity sensor measurement is detected in specified operating range OR dehumidification mode using RH sensor is disabled. • Check sensor and wiring.","p":79},{"c":"77*","m":"DISCHARGE AIR TEMP SENSOR","a":"• If measurement of the discharge air temperature sensor is out of specified range (including open / short detection) the alarm will be activated. Alarm will automatically clear once in range condition is detected. • Check sensor and wiring.","p":79},{"c":"78*","m":"RETURN AIR TEMP SENSOR","a":"• If measurement of the return air temperature sensor is out of specified range (including open / short detection) the alarm will be activated. Alarm will automatically clear once in range condition is detected. • Check sensor and wiring.","p":79},{"c":"79*","m":"ID ADD ON BOARD PROBLEM","a":"Add-on board problem, reset CORE Unit Controller to clear. When the communication Alarm 80 persists for more than 30 seconds even after several retries for establishing the communication this alarm is logged. Alarm can only be cleared by CORE Unit Controller reset.","p":79},{"c":"80","m":"ID ADD ON BOARD PROBLEM","a":"When the CORE Unit Controller is not able to communicate with any attached add-on boards (C3 and GP3), this alarm code is logged. The CORE Unit Controller will retry to establish the communication once every 5 seconds. Alarm is automatically cleared once communication is restored.","p":79},{"c":"81","m":"REHEAT SETUP ERROR","a":"Check reheat settings. Alarm 81 is raised under these two conditions: 1. If the user sets up the unit to use supermarket reheat on a non- gas unit. 2. If the user sets up the unit to use Humiditrol reheat but the heater type is heat pump.","p":79},{"c":"82","m":"CONTROLLER RESET","a":"The reason (if known) for the reset displays after the M4 unit controller resets.","p":79},{"c":"83","m":"INCORRECT SETTINGS","a":"Check system configuration.","p":79},{"c":"84","m":"RESERVED","a":"","p":79},{"c":"85","m":"INCORRECT HUMIDITROL","a":"Check Humiditrol settings. Check Configuration ID 1, position 1 and verify that the position is not set to U. Should be set to either N (not installed) or H (Humiditrol). Alarm will auto- matically clear once correct option is set.","p":79},{"c":"86*","m":"CONFLICTING TSTAT INPUT","a":"Check thermostat inputs for simultaneous heat and cooling wiring. Once condition is cor- rected, unit controller will resume operation after error time off day has expired.","p":79},{"c":"87","m":"RESERVED","a":"","p":79},{"c":"88 - 90","m":"RESERVED","a":"","p":79},{"c":"91*","m":"OUTDOOR ENTHALPY SENSOR","a":"• If Enthalpy Sensor failure is detected, the system will disable ‘Free Cooling’ operation. NOTE: Valid Outdoor Enthalpy Sensor reading is required for both ‘ODE’ (Outdoor Enthalpy) and ‘ODE differential’ (Outdoor differential). Valid Indoor Enthalpy Sensor reading is required for ‘ODE differential’ (Outdoor differential). • Check economizer Parameters 160 and 161. Also check enthalpy Parameters 162 and 163. • Check sensor and wiring.","p":80},{"c":"92*","m":"INDOOR ENTHALPY SENSOR","a":"• If Enthalpy Sensor failure is detected, the system will disable ‘Free Cooling’ operation. NOTE: Valid Outdoor Enthalpy Sensor reading is required for both ‘ODE’ (Outdoor Enthalpy) and ‘ODE differential’ (Outdoor differential). Valid Indoor Enthalpy Sensor reading is required for ‘ODE differential’ (Outdoor differential). • Check wiring and test A62 sensor using specified method in CORE application guide, section titled economizer checkout.","p":80},{"c":"93*","m":"UNIT OPERATING IN BACKUP MODE","a":"• Check communication loss with network sensor or if CORE Unit Controller. • Check if NETWORK INTEGRATION is set to RTU STANDALONE MODE and backup sensor is set to RETURN AIR BACKUP. • While running in backup mode, the unit controller will set this alarm. The unit controller will return from Backup mode to Primary (Main) mode on a reset or after the Primary mode (room Sensor is not in error or OR network communication is re- established and available for 300 seconds. • Backup mode alarm will be cleared on the reset OR after the unit controller has returned to primary (main) system mode.","p":80},{"c":"94*","m":"ZONE SETPOINT ERROR","a":"Ensure that the heating and cooling setpoints honor the auto-changeover deadband.","p":80},{"c":"95 - 98","m":"RESERVED","a":"","p":80},{"c":"99*","m":"OUTSIDE AIR VELOCITY SENSOR ERROR","a":"Check sensor and wiring. This alarm activates when the A24 sensor input signal is contin- uously above 25% of sensor measuring range for more than five minutes with the blower stopped. The CORE Unit Controller will disable the Outdoor Air CFM control. The alarm automatically clears when the sensor reading is below 10% sensor measuring range for one minute.","p":80},{"c":"100","m":"RESERVED","a":"","p":80},{"c":"101","m":"RESERVED","a":"","p":80},{"c":"102","m":"RESERVED","a":"","p":80},{"c":"103*","m":"ADVANCED CONTROL SETUP ERROR","a":"Check CORE Unit Controller Configuration ID 1 settings.","p":80},{"c":"104","m":"RESERVED","a":"","p":80},{"c":"105","m":"RESERVED","a":"","p":80},{"c":"106*","m":"BUILDING PRESSURE SENSOR PROBLEM","a":"Check sensor and wiring.","p":80},{"c":"107*","m":"DUCT SUPPLY PRESS SENSOR PROBLEM","a":"Check sensor and wiring. The unit controller will set Supply Air Static Pressure Sensor (A30) error status if: • Input signal is above 4.9” wc for more than 30 seconds. OR • Input signal is below 0.1”wc 20 seconds after the blower has started with setting at or above Blower Output Static Duct Alarm Check. The CORE Unit Controller will clear the Supply Air Static Pressure Sensor (A30) error status and alarm after the expiration of Error Time OFF delay.","p":80},{"c":"108","m":"SUPPLY DUCT PRESS LIMIT EX- CEEDED","a":"• Check sensor and wiring. • The CORE Unit Controller will shutdown operation for Error Off time (Parameter 110) if supply air static pressure exceeds supply static shutdown setpoint for 20 seconds (default) Parameter 42. • The CORE Unit Controller will clear High Supply Static (Duct) Pressure after Error Off Time has expired and static duct pressure is below Supply Static Setpoint Shutdown.","p":80},{"c":"109*","m":"STRIKE 3 SUPPLY DUCT PRESSURE LIMIT","a":"• Check sensor and wiring. • Unit controller will “lock out” a unit operation after the Max Static Duct Pressure Occurrences have occurred of Supply Static Pressure Sensor Error (alarm 107) and/ or High Supply Static (Duct) Pressure (Alarm 108). • User will be able to clear supply static pressure lockout and alarm via User Interface. Supply Static Pressure lockout and alarm will be cleared after the unit controller reset. • The number of strikes is three by default. This can be changed using Parameter 43. Optional occurrence setting is 1 to 7.","p":81},{"c":"110","m":"WAITING ON SENSOR DATA","a":"Check network or comfort sensor and wiring.","p":81},{"c":"111","m":"PROFILE ERROR","a":"Configuration profile unrecoverable. Settings may have changed.","p":81},{"c":"112 - 119","m":"RESERVED","a":"","p":81},{"c":"120","m":"FIRMWARE UPDATE FAILURE","a":"Check USB to determine whether the correct firmware is loaded.","p":81},{"c":"121*","m":"LINE FREQUENCY MISMATCH","a":"Power source line frequency is determined by the entered model number. This alarm is enabled by the Phase Voltage Detection feature. The CORE Unit Controller does not have an automatic clearing method. Cycle power or reset the unit to re-evaluate the phase sequence.","p":81},{"c":"122*","m":"24VAC PRIMARY VOLTAGE LOW","a":"• Low output voltage on T1 transformer. Alarm set when 24VAC voltage low if calculated RMS voltage is below low voltage alarm threshold for more than two seconds. System will stop unit operations (cooling, heating and ventilation). Low voltage threshold is 18VAC. • The CORE Unit Controller will clear alarm 24VAC Voltage Low if calculated RMS voltage is above Low Voltage Alarm Threshold + 1 VAC for more than two seconds. After the low 24VAC alarm has been cleared, the CORE Unit Controller will ignore all service demands until the Error Time Off Delay has expired.","p":81},{"c":"123*","m":"24VAC PRIMARY VOLTAGE HIGH","a":"• High output voltage on T1 transformer. Alarm set when 24VAC voltage high if calculated RMS voltage is below low voltage alarm threshold for more than two seconds. System will stop unit operations (cooling, heating and ventilation). Low voltage threshold is 30VAC. • The CORE Unit Controller will clear alarm 24VAC Voltage high if calculated RMS voltage is above High Voltage Alarm Threshold + 1 VAC for more than two seconds. After the HIGH 24VAC alarm has been cleared, the CORE Unit Controller will ignore all service demands until the Error Time Off Delay has expired.","p":81},{"c":"124*","m":"24VAC SECONDARY VOLTAGE LOW","a":"• Low output voltage on T1 transformer. Alarm set when 24VAC voltage low if calculated RMS voltage is below low voltage alarm threshold for more than two seconds. System will stop unit operations (cooling, heating and ventilation). Low voltage threshold is 18VAC. • The CORE Unit Controller will clear alarm 24VAC voltage low if calculated RMS voltage is above Low Voltage Alarm Threshold + 1 VAC for more than two seconds. After the low 24VAC alarm has been cleared, the CORE Unit Controller will ignore all service demands until the Error Time Off Delay has expired.","p":81},{"c":"125*","m":"24VAC SECONDARY VOLTAGE HIGH","a":"• High output voltage on T1 transformer. Alarm set when 24VAC voltage high if calculated RMS voltage is below low voltage alarm threshold for more than two seconds. System will stop unit operations (cooling, heating and ventilation). Low voltage threshold is 30VAC. • The CORE Unit Controller will clear alarm 24VAC Voltage HIGH if calculated RMS voltage is above high voltage alarm Threshold + 1 VAC for more than two seconds. After the high 24VAC alarm has been cleared the CORE Unit Controller will ignore all service demands until the Error Time Off Delay has expired.","p":81},{"c":"126*","m":"LINE PHASING MISMATCH","a":"During power up or reset of unit, mismatch on single or 3 phase power, or reverse rotation on 3 phase detected. This alarm is enabled by the Phase Voltage Detection feature.","p":81},{"c":"127","m":"RESERVED","a":"","p":81},{"c":"128","m":"RESERVED","a":"","p":81},{"c":"129*","m":"VFD SHUTDOWN","a":"• Indoor blower VFD fault detected. The CORE Control System will monitor the motor status ten seconds after blower command is sent. The CORE Unit Controller will stop unit operation if fault conditions are detected. • Check belt and for blower overload. Fix source of fault and cycle power to the RTU.","p":81},{"c":"130","m":"VFD BYPASS ENGAGED","a":"VFD bypass mode. Mode is engaged. Blower may or may not be disengaged.","p":81},{"c":"131","m":"RESERVED","a":"","p":81},{"c":"132","m":"VFD BYPASS UNCONFIGURED","a":"VFD bypass mode has not been selected. Unit operates as if bypass is not installed.","p":81},{"c":"133","m":"RESERVED","a":"","p":81},{"c":"134","m":"LOW SUPPLY AIRFLOW","a":"RTU indicates airflow target cannot be achieved.","p":82},{"c":"135","m":"NO SUPPLY AIRFLOW","a":"Blower RPM is too low indicating that the blower is not working.","p":82},{"c":"136","m":"OA DAMPER MECH FAULT","a":"Outdoor air damper stuck or actuator problem.","p":82},{"c":"137","m":"DAMPER STUCK CLOSED","a":"• The damper is not opening to the target percentage. Unit may be bringing in less than anticipated outdoor air. • Inspect damper and / or actuator for blockage. Alarm is raised when damper actuator feedback exceeds 2v under target for 2 minutes. • Alarm will reset automatically when damper feedback falls to 1.8v within the target voltage.","p":82},{"c":"138","m":"RESERVED","a":"","p":82},{"c":"139","m":"DAMPER STUCK OPEN","a":"• The Damper is not closing to the target percentage. Unit may be bringing in more than anticipated outdoor air. • Inspect damper and / or actuator for blockage. Alarm is raised when damper actuator feedback exceeds 2v under target for 2 minutes. • Alarm will reset automatically when damper feedback falls to 1.8v within the target voltage.","p":82},{"c":"140","m":"CFM TARGET TOO LOW","a":"CFM Unattainable. Verify the MSAV blower settings and set the CM targets below set CFM.","p":82},{"c":"141","m":"CFM TARGET TOO HIGH","a":"CFM Unattainable. Verify the MSAV blower settings and set the CM targets below set CFM.","p":82},{"c":"142","m":"RESERVED","a":"","p":82},{"c":"143","m":"OA DAMPER ERROR","a":"Outdoor air differential pressure sensor value not in valid range.","p":82},{"c":"144","m":"RESERVED","a":"","p":82},{"c":"145","m":"RESERVED","a":"","p":82},{"c":"146","m":"SERVICE EVENT","a":"Service event logged.","p":82},{"c":"147*","m":"DAMPER FEEDBACK LOSS","a":"During free cooling damper is not modulating.","p":82},{"c":"148*","m":"ADV AIRFLOW CONFIG ERROR","a":"Economizer should be installed and blower should be ecm type.","p":82},{"c":"149*","m":"OA DIFF PRESS SENSOR ERROR","a":"Check outdoor air damper differential pressure sensor and wiring.","p":82},{"c":"150*","m":"NOT ECONOMIZING WHEN OAS","a":"May be due to the damper motor being unplugged or disconnected.","p":82},{"c":"151*","m":"ECONOMIZING WHEN OANS","a":"This may be due to damper motor being blocked or stuck open and therefore not closing.","p":82},{"c":"152","m":"A2L SENSOR LEAK","a":"Check R454A leaking.","p":82},{"c":"153","m":"A2L SENSOR LEAK","a":"Check R454A leaking.","p":82},{"c":"154 - 162","m":"RESERVED","a":"","p":82},{"c":"163","m":"LIQUID PRESSURE SENSOR OPEN","a":"Sensor reading is outside the valid range.","p":82},{"c":"164","m":"STRIKE 3 LIQUID PRESSURE SENOR OPEN","a":"Sensor reading is outside the valid range.","p":82},{"c":"165","m":"ECONOMIZER UNCONFIGURED","a":"Configuration ID 1, position 2 is set to U. Select applicable option using setup/install wizard.","p":82},{"c":"166","m":"GAS CAP NO OPEN PROOF GV1","a":"This alarm occurs when the combustion air pressure switch (S18) is detected as closed immediately after the furnace demand relay is energized and before the combustion air blower is energized. Gas valve 1.","p":82},{"c":"167","m":"GAS CAP NO OPEN PROOF GV2","a":"This alarm occurs when the combustion air pressure switch (S45) is detected as closed immediately after the furnace demand relay is energized and before the combustion air blower is energized. Gas valve 2.","p":82},{"c":"168","m":"GAS CAP NO OPEN PROOF LOCK- OUT GV1","a":"This alarm occurs when the combustion air pressure switch (S18) is detected as closed immediately after the furnace demand relay is energized and before the combustion air blower is energized. Gas valve 1","p":82},{"c":"169","m":"GAS CAP NO OPEN PROOF LOCK- OUT GV2","a":"This alarm occurs when the combustion air pressure switch (S45) is detected as closed immediately after the furnace demand relay is energized and before the combustion air blower is energized. Gas valve 2.","p":82},{"c":"170","m":"POWER EXHAUST UNCONFIGURED","a":"Configuration ID 1, position 3 is set as U (Unconfigured).","p":82},{"c":"171","m":"POWER EXHAUST CONFIGURATION ERROR","a":"Configuration ID 1, position 4 is set correctly. If position 3 is configured then position 4 must be also.","p":82},{"c":"172","m":"EP UNCONFIGURED","a":"Economizer should be installed and blower should be ECM type.","p":82},{"c":"173","m":"AIRFLOW SWITCH CONFIGURATION ERROR","a":"Verify that Configuration ID 2, position 1 is set correctly.","p":83},{"c":"174","m":"BYPASS DAMPER CONFIGURATION ERROR","a":"Room bypass damper operation should only be used if blower is configured for CAV oper- ation. Unit Controller will only allow zone bypass unit operation if configuration ID1 is set correctly. Alarm will automatically clear when configuration conflict is corrected.","p":83},{"c":"175","m":"NO INPUT SHARING","a":"Alarm will occur if load shedding input is shared with other optional devices or inputs, for example - global, blower overload, drain pan overflow, etc.","p":83},{"c":"176","m":"SBUS OBSOLETE M2 COMMAND","a":"This alarm occurs when a S-BUS primary device sends a M2 style command to the CORE Unit Controller. The alarm is immediately cleared and a history of the event is stored.","p":83},{"c":"177","m":"NO MODEL NUMBER","a":"Missing model configuration data. Run setup > install and complete model number infor- mation.","p":83},{"c":"178 - 181","m":"RESERVED","a":"","p":83},{"c":"182","m":"SUCTION PRESSURE SENSOR","a":"Sensor reading is outside the valid range.","p":83},{"c":"183","m":"COMP1 SUMP TEMP SENSOR","a":"Sensor reading is outside the valid range.","p":83},{"c":"184","m":"COMP2 SUMP TEMP SENSOR","a":"Sensor reading is outside the valid range.","p":83},{"c":"185","m":"ULTRA ALARM","a":"Generic alarm for ultra issues. The alarming value will have different values for different issues","p":83},{"c":"186*","m":"BLOWER MOTOR FAULT","a":"DirectPlus blower fault detected. The CORE Control System will monitor the motor status ten seconds after blower command is sent. The CORE Unit Controller will stop unit operation if fault conditions are detected. Fix source of fault and reset (reboot) CORE Unit Controller. NOTE: For blowers connected via MODBUS, the alarming Value = any present motor alarms. Sum of the error numbers equals the current fault, for example 48 means motor overheated (32 + 16): 1 - Phase failure (3-phase devices) or mains under voltage (1-phase devices) 4 - Power module overheated 8 - Communication error between CORE Unit Controller and blower 16 - Fan bad (general error, set with every error condition) 32 - Motor overheated 64 - Hall sensor error 128 - Locked motor 4096 - DC-link under voltage","p":83},{"c":"187","m":"INVERTER MINOR","a":"• Alarming Value = Inverter error code • Possible alarming values for Alarm 187 are: > 12 - High Comp Current > 13 - High Heat sink temperature > 14 - High PFC input current • If the alarm continues after outdoor conditions have moderated, check the fan, charge, and coil. Alarm 187 will automatically clear when minimum off time expires. • Refer to trouble shooting guide in service manual for more information.","p":83},{"c":"188","m":"INVERTER MAJOR","a":"• Alarming Value = Inverter error code • Possible alarming values for unit controller Alarm 188 are: > 21 - Peak DC current > 22 - Maximum current reached lockout > 23 - DC Link low voltage > 26 - Locked Rotor > 28 - DC Link high voltage > 29 - Compressor over current > 61 - Low outdoor ambient inverter lockout > 62 - High Heat Sink Temperature lockout > 75 - Low Input Voltage • No action required. Compressor stops for the duration of the minimum run time. Unit shuts down after ten occurrences in one hour and Alarm 189 is initiated. Alarm 188 will automatically clear when inverter error clears. • Refer to trouble shooting guide in service manual for more information.","p":84},{"c":"189","m":"INVERTER FATAL","a":"• Alarming Value = Inverter error code • Possible alarming values for alarm 189 are 21, 22, 23, 26, 28, 29, 61, 62 and 75. • Alarm 189 will clear upon manual reset. • Refer to trouble shooting guide in service manual for more information.","p":84},{"c":"190","m":"INVERTER COMMUNICATION ERROR","a":"Unable to communicate with inverter. The unit controller disables compressor operation. Replace communication cable between inverter and CORE Unit Controller. If alarm contin- ues, replace CORE Unit Controller or inverter.","p":84},{"c":"191","m":"INVERTER VOLTAGE MISMATCH","a":"The unit controller disables compressor operation. Replace with correct inverter part.","p":84},{"c":"192 - 193","m":"RESERVED","a":"","p":84},{"c":"194","m":"CRITICAL LOSS CONDENSER AIR- FLOW","a":"Critical Loss of Condenser Airflow","p":84},{"c":"195 - 198","m":"RESERVED","a":"","p":84},{"c":"199","m":"CRITICAL LOSS OF EVAPORATOR AIRFLOW","a":"Critical Loss of Evaporator Airflow.","p":84},{"c":"200","m":"COMPRESSOR 1 NOT OPERATING","a":"Compressor 1 apparently not operating. Coil temperatures not changing as expected.","p":84},{"c":"201","m":"COMPRESSOR 2 NOT OPERATING","a":"Compressor 2 apparently not operating. Coil temperatures not changing as expected.","p":84},{"c":"202","m":"COMPRESSOR 3 NOT OPERATING","a":"Compressor 3 apparently not operating. Coil temperatures not changing as expected.","p":84},{"c":"203","m":"COMPRESSOR 4 NOT OPERATING","a":"Compressor 4 apparently not operating. Coil temperatures not changing as expected.","p":84},{"c":"204","m":"COMPRESSOR 1 TXV FAILED CLOSED","a":"Compressor 1 TXV Failed Closed.","p":84},{"c":"205","m":"COMPRESSOR 2 TXV FAILED CLOSED","a":"Compressor 2 TXV Failed Closed.","p":84},{"c":"206","m":"COMPRESSOR 3 TXV FAILED CLOSED","a":"Compressor 3 TXV Failed Closed.","p":84},{"c":"207","m":"COMPRESSOR 4 TXV FAILED CLOSED","a":"Compressor 4 TXV Failed Closed.","p":84},{"c":"208","m":"Major Loss of Charge Compressor 1","a":"Major Loss of Charge Compressor 1","p":84},{"c":"209","m":"Major Loss of Charge Compressor 2","a":"Major Loss of Charge Compressor 2","p":84},{"c":"210","m":"Major Loss of Charge Compressor 3","a":"Major Loss of Charge Compressor 3","p":84},{"c":"211","m":"Major Loss of Charge Compressor 4","a":"Major Loss of Charge Compressor 4","p":84},{"c":"212","m":"Major Loss of Condenser Airflow","a":"Major Loss of Condenser Airflow","p":84},{"c":"213","m":"Major Loss of Evaporator Airflow","a":"Major Loss of Evaporator Airflow","p":84},{"c":"214","m":"Compressor Flooding Compressor 1","a":"Compressor Flooding Compressor 1","p":84},{"c":"215","m":"Compressor Flooding Compressor 2","a":"Compressor Flooding Compressor 2","p":84},{"c":"216","m":"Compressor Flooding Compressor 3","a":"Compressor Flooding Compressor 3","p":84},{"c":"217","m":"Compressor Flooding Compressor 4","a":"Compressor Flooding Compressor 4","p":84},{"c":"218","m":"SLT SENSOR FAILURE COMPRESSOR 1","a":"Saturated Liquid Temperature sensor on the condenser coil is not giving expected values for the indicated compressor circuit. Alarming Values: 1 – Open Circuit: Less than or equal to -66°F (res >= 930kohms). 2 – Short Circuit: Greater than or equal to 500°F (res <= 24ohms). 3 – Out of Range: Less than -40°F or greater than 150°F. 4 – Dislodged (operational check) If alarm indicates “open”, “short” or “out of range” check sensor and wiring. Alarm clears when in-range condition is detected. If alarm indicates “dislodged”, check that the sensor is installed properly and is seated properly to the fitting and is not loose or improperly installed. Alarm clears on a controller reset.","p":85},{"c":"219","m":"SLT SENSOR FAILURE COMPRESSOR 2","a":"","p":85},{"c":"220","m":"SLT SENSOR FAILURE COMPRESSOR 3","a":"","p":85},{"c":"221","m":"SLT SENSOR FAILURE COMPRESSOR 4","a":"","p":85},{"c":"222 - 225","m":"RESERVED","a":"","p":85},{"c":"226","m":"SST SENSOR FAILURE COMPRESSOR 1","a":"Saturated Suction Temperature sensor on the evaporator coil is not giving expected values for the indicated compressor circuit. Alarming Values: 1 – Open Circuit: Less than or equal to -66°F (res >= 930kohms) 2 – Short Circuit: Greater than or equal to 500°F (res <= 24ohms) 3 – Out of Range: Less than -40°F or greater than 150°F 4 – Dislodged (operational check) If alarm indicates “open”, “short” or “out of range” check sensor and wiring. Alarm clears when in-range condition is detected. If alarm indicates “dislodged” check that the sensor is installed properly and is seated properly to the fitting and is not loose or improperly installed. Alarm clears on a controller reset.","p":85},{"c":"227","m":"SST SENSOR FAILURE COMPRESSOR 2","a":"","p":85},{"c":"228","m":"SST SENSOR FAILURE COMPRESSOR 3","a":"","p":85},{"c":"229","m":"SST SENSOR FAILURE COMPRESSOR 4","a":"","p":85},{"c":"230 - 233","m":"RESERVED","a":"","p":85},{"c":"234","m":"DSI BOARD 1 ERROR","a":"Direct Spark Ignition Board 1 Error. Restart DSI Board 1 and troubleshoot wiring. Replace- ment may be required.","p":85},{"c":"235","m":"DSI BOARD 2 ERROR","a":"Direct Spark Ignition Board 2 Error. Restart DSI Board 2 and troubleshoot wiring. Replace- ment may be required.","p":85},{"c":"236","m":"DSI BOARD 1 FLAME LOSS","a":"Direct Spark Ignition Board 1 flame loss maximum reached. Board will be locked out for 1 hour. Check gas valve, ignition, and wiring. Lockout may be manually reset by removing power from the control for more than 1 second or removing the thermostat call for heat for more than 1 and less than 20 seconds.","p":85},{"c":"237","m":"DSI BOARD 2 FLAME LOSS","a":"Direct Spark Ignition Board 2 flame loss maximum reached. Board will be locked out for 1 hour. Check gas valve, ignition, and wiring. Lockout may be manually reset by removing power from the control for more than 1 second or removing the thermostat call for heat for more than 1 and less than 20 seconds.","p":85},{"c":"238","m":"UTEC 1 MODBUS FAULT","a":"Direct Spark Ignition Board 1 Modbus Loss Error. Restart DSI Board 1 and troubleshoot wiring. Replacement may be required.","p":85},{"c":"239","m":"UTEC 2 MODBUS FAULT","a":"Direct Spark Ignition Board 2 Modbus Loss Error. Restart DSI Board 2 and troubleshoot wiring. Replacement may be required.","p":85},{"c":"240","m":"DSI BOARD 1 VALVE FAULT","a":"Direct Spark Ignition Board 1 loss of gas valve feedback detected. CORE Unit Controller will lockout gas valve 1 operation. Check gas valve and wiring.","p":85},{"c":"241","m":"DSI BOARD 2 VALVE FAULT","a":"Direct Spark Ignition Board 2 loss of gas valve feedback detected. CORE Unit Controller will lockout gas valve 2 operation. Check gas valve and wiring.","p":85},{"c":"242","m":"DSI BOARD 1 LOCKOUT","a":"Direct Spark Ignition Board 1 valve fault detected and is locked out. Multiple failures has occurred. Resolve ignition issues and restart unit. CORE Unit Controller will lock out gas valve 1 operation.","p":85},{"c":"243","m":"DSI BOARD 2 LOCKOUT","a":"Direct Spark Ignition Board 2 valve fault detected and is locked out. Multiple failures has occurred. Resolve ignition issues and restart unit. CORE Unit Controller will lock out gas valve 2 operation.","p":86},{"c":"244","m":"BLOWER DIFFERENTIAL PRESSURE SENSOR ERROR","a":"A and B Box units equipped with ‘E’ type DirectPlus blowers. - Blower differential pressure sensor error; replace sensor.","p":86},{"c":"245","m":"BIPOLAR IONIZER FAULT","a":"A Bipolar Ionizer fault is detected (J387-2 High). Alarm will clear automatically upon resolution of the problem (J387-2 Low). Check Bipolar Ionizer (Control: J392-1,3; Monitor: J387-2,7), replace if necessary.","p":86},{"c":"246 - 255","m":"RESERVED","a":"","p":86},{"c":"256","m":"MCU/MPU COMMS LOSS","a":"Loss of communication between M4 and W4 boards","p":86},{"c":"257","m":"A2L SENSOR1 FAULT","a":"Check leak, check sensor 1.","p":86},{"c":"258","m":"A2L SENSOR2 FAULT","a":"Check leak, check sensor 2.","p":86},{"c":"259","m":"A2L SENSOR3 FAULT","a":"Check leak, check sensor 3","p":86},{"c":"260 - 512","m":"RESERVED","a":"","p":86},{"c":"513","m":"ERROR READING USB DEVICE","a":"Error Reading USB Device","p":86},{"c":"514","m":"USB DEVICE NOT MOUNTED","a":"USB Device not Mounted","p":86},{"c":"515","m":"USB DEVICE FULL","a":"USB Device Full","p":86},{"c":"516","m":"INVALID DIN NUMBER","a":"Invalid DIN number received from CORE Unit Controller, indicates DIN incompatibility","p":86},{"c":"520","m":"FWM SOFTWARE MISMATCH","a":"Firmware Update Failed: Software Mismatch between CORE Unit Controller and W4 Communication Module.","p":86},{"c":"521","m":"W4 STANDALONE","a":"The W4 is unable to communicate to the CORE Unit Controller.","p":86}],"pa":[{"n":"1 - 4","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat":"Power and Damper Parameters","p":87},{"n":"5","t":"Variable Air Volume Control Mode","mn":"0","d":"If applicable to specific unit, see unit Parameter label for default setting.","mx":"511","u":"Option","x":"Applicable to Energence Standard Efficiency 3- to 6-ton units only. • 16 = Runs the blower in high speed when occupied and there is not other active demand (room sensor mode only) • 32 = Runs the blower in high speed when G is active and there is no other active demand (thermostat mode only)","cat":"Power and Damper Parameters","p":87},{"n":"6","t":"Blower Smoke Output","mn":"20","d":"Check unit label as Parameters may be configured to order.","mx":"100","u":"%","x":"• Applicable to Energence High Efficiency 3- to 5-ton units. • Blower staged percentage output during smoke detection.","cat":"Power and Damper Parameters","p":87},{"n":"7","t":"Blower Heat Output","mn":"20","d":"Depends on equipment.","mx":"100","u":"%","x":"• Applicable to Energence High Efficiency 3- to 5-ton units only. • Blower staged percentage output high speed; used for high heating speed.","cat":"Power and Damper Parameters","p":87},{"n":"8","t":"Blower Cool Output","mn":"20","d":"Depends on equipment.","mx":"100","u":"%","x":"• Applicable to Energence High Efficiency 3- to 5-ton units only. • Blower staged percentage output low speed; used for low cooling or ventilation.","cat":"Power and Damper Parameters","p":87},{"n":"9","t":"Minimum Damper Posi- tion During High Speed Blower Operation","mn":"0","d":"0","mx":"100","u":"%","x":"• Minimum damper position during low speed blower operation. • Use Parameter 132 during high speed blower operation","cat":"Power and Damper Parameters","p":87},{"n":"10","t":"Free Cooling Blower Stage Up Delay","mn":"0","d":"300","mx":"1800","u":"Sec","x":"• Applicable to Energence Standard Efficiency 3- to 6-ton units only. • Free cooling blower stage-up delay. Blower runs low speed during delay, and then shifts to high speed.","cat":"Power and Damper Parameters","p":87},{"n":"11","t":"Enabled Field Status Report","mn":"","d":"Default 0 = OFF 1 = ON","mx":"","u":"Option","x":"Enabled Field Status Report","cat":"Power and Damper Parameters","p":87},{"n":"12","t":"Multi-Stage Air Volume Smoke Detection Mode (Alarm)","mn":"450","d":"Default may be altered at factory test.","mx":"24000","u":"CFM","x":"Multi-Stage Air Volume Smoke Detection Mode (Alarm) NOTE: In order for the SMOKE CFM change to take effect, go the SETUP > TEST & BALANCE > BLOWER and run the wizard. Performing this task will recalculate the output to the desired CFM. No adjustments are required during this procedure.","cat":"Power and Damper Parameters","p":87},{"n":"13","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat":"Power and Damper Parameters","p":87},{"n":"14","t":"Multi-Stage Air Volume Cooling Hi CFM","mn":"450","d":"5200","mx":"24000","u":"COUNT","x":"Increments of 25.","cat":"Power and Damper Parameters","p":87},{"n":"15","t":"Multi-Stage Air Volume Cooling Medium CFM","mn":"450","d":"3375","mx":"24000","u":"COUNT","x":"Increments of 25.","cat":"Power and Damper Parameters","p":87},{"n":"16","t":"Multi-Stage Air Volume Cooling Medium Low CFM","mn":"450","d":"3375","mx":"24000","u":"COUNT","x":"Increments of 25.","cat":"Power and Damper Parameters","p":87},{"n":"17"," sors are on, but the effect of mechanical cooling may force the damper closed to its minimum position. After compressor starts, the free cooling setpoint is lowered to a fixed temperature of 45°F. • Option 1: Damper opens to its max open position (Parameter 131 - FREE CL MAX DAMPER) when any compressors start. NOTE: When using Option 1 and after the compressor is stopped, the CORE Unit Controller will resume damper modulation. • Option 2: Damper continues to modulate while compressors are on, but the effect of mechanical cooling may force the damper closed to its minimum position. This is the factory default setting. > Holds off compressor on Y2 call until damper has modulated to maximum position (Parameter 131 - FREE CL MAX DAMPER) for three minutes. > After three minutes, compressor starts and the free cooling setpoint is lowered to 45°F. Damper is not locked at maximum open while compressor is on, but modulates to maintain 45°F discharge air temperature. > When Y2 is satisfied, compressor goes off and free cooling setpoint is restored to 55°F (Parameter 159 - FREE COOL SUPPLY SP). • Option 3: Same as Option 2, but with a 10-minute delay instead of a three-minute delay.","cat":"System 1 Parameters","p":96},{"n":"165","t":"Fresh Air Heating Stage Differential","mn":"0","d":"2","mx":"20","u":"°F","x":"• Fresh Air Heating stage differential. • 0 value for first stage heating only for Fresh Air Heating.","cat":"System 2 Parameters","p":96},{"n":"166","t":"Fresh Air Heating Control Reheat Outdoor Air Tem- perature Setpoint","mn":"20","d":"40","mx":"60","u":"°F","x":"Outdoor air temperature setpoint that enables fresh air heating for reheat demand and opens damper to parameter 167 when outdoor air is less than setpoint.","cat":"System 2 Parameters","p":96},{"n":"167","t":"Fresh Air Heating Control Reheat Damper Position","mn":"5","d":"40","mx":"100","u":"%","x":"Fresh air damper position during Fresh Air Heating reheat operation.","cat":"System 2 Parameters","p":96},{"n 52","t":"Enhanced Dehumidifica- tion Minimum Setpoint","mn":"45","d":"45","mx":"50","u":"°F","x":"• The discharge air target used for zone- temperature-based enhanced dehumidification (EDH-ZAT) operation when Zone Temperature setpoint is < 70F. • To configure EDH, use the RTU MENU > SETUP > INSTALL wizard.","cat":"System 3 Parameters","p":102},{"n":"453 - 462","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat":"System 3 Parameters","p":102},{"n":"463","t":"SST Minimum Setpoint","mn":"35","d":"40","mx":"50","u":"°F","x":"Minimum Saturated Suction Temperature (SST) target for the RTU coil, used in Humiditrol operations.","cat":"System 3 Parameters","p":102},{"n":"464","t":"SST Maximum Setpoint","mn":"40","d":"45","mx":"50","u":"°F","x":"Maximum Saturated Suction Temperature (SST) target for the RTU coil, used in Humiditrol operations.","cat":"System 3 Parameters","p":102},{"n":"465 - 466","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat":"System 3 Parameters","p":102},{"n":"467","t":"Reheat Fan DAT Target TSTAT","mn":"50","d":"70","mx":"100","u":"°F","x":"Discharge Air Temperature (DAT) target for reheat (Humiditrol) operation. Condenser fans will attempt to control exiting air temperature to this value. This is used only in TSTAT applications.","cat":"System 3 Parameters","p":102},{"n":"468","t":"Reheat Blower SST Target TSTAT","mn":"30","d":"45","mx":"60","u":"°F","x":"Saturated Suction Temperature (SST) target for reheat (Humiditrol) operation. This is only used in TSTAT Applications","cat":"System 3 Parameters","p":102},{"n":"469 - 476","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat":"System 3 Parameters","p":102},{"n":"477","t":"Free Cooling High Blow- er Error","mn":"10","d":"60","mx":"90","u":"%","x":"Free Cooling threshold for high blower PI error. Used for determining when to add or remove mechanical cooling in Room Sensor Mode.","cat":"System 3 Parameters","p":102},{"n":"478","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat": ing is already active and OAT drops to or below this setpoint, mechanical heating will be stopped. When LAH lockout is in effect, electric heat will be enabled on W1 calls, if units are equipped with EH. For units without aux electric heat, the unit will not provide any heating when below this threshold.","cat":"System 3 Parameters","p":103},{"n":"528","t":"Heat Pump Low Ambient Heating (LAH) Compres- sor Lockout Temperature High","mn":"-50","d":"-4","mx":"0","u":"°F","x":"This parameter controls when heat pump operation will be locked-out. If mechanical heating is not active when heat demand changes and OAT is at or below this setpoint, mechanical heating will not be started. When LAH lockout is in effect, electric heat will be enabled on W1 calls, if units are equipped with EH. For units without aux electric heat, the unit will not provide any heating when below this threshold.","cat":"System 3 Parameters","p":103},{"n":"529 - 530","t":"RESERVED","mn":"","d":"","mx":"","u":"","x":"","cat":"System 3 Parameters","p":103},{"n":"531","t":"Blower On Delay After Mechanical Heating Demand","mn":"0","d":"0","mx":"60","u":"Seconds","x":"The time before the blower turns on after a heating demand.","cat":"System 3 Parameters","p":103},{"n":"532","t":"Blower Off Delay After Mechanical Heating Demand Termination","mn":"0","d":"20","mx":"300","u":"Seconds","x":"The time the blower stays on after the heating demand is terminated.","cat":"System 3 Parameters","p":103},{"n":"533","t":"Heat Pump Heat Warm-up Time Delay for Economizer","mn":"0","d":"3600","mx":"8160","u":"Seconds","x":"Warm-up time delay. The time that the economizer is forced closed during warm-up (first occupied + heat demand). This applies to LH and LD units, regardless of the secondary heat source.","cat":"System 3 Parameters","p":103},{"n":"534","t":"Heat Pump Heat Maxi- mum Lower Stage Run Time in Room Sensor Applications","mn":"0","d":"912","mx":"3600","u":"Seconds","x":"Stage up timer. The maximum time that   res.innerHTML=`<div class="sec">${m.length} result(s)${m.length>150?' (first 150 – refine search)':''}</div>`+Object.keys(groups).map(g=>`<div class="sec" style="margin-top:6px">${E(g)}</div><div class="card">${groups[g].map(rowf).join('')}</div>`).join('');

 q.oninput=go;cat.onchange=go;q.onfocus=go;document.addEventListener('click',e=>{if(!e.target.closest('.dd'))dd.hidden=true});go()}
